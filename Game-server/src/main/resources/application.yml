server:
  port: ${PORT:8080}

spring:
  application:
    name: game-server
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    # Strict input (REST and WebSocket): 1.7 is not an integer, "9" is not a number, a key may appear once, and
    # nothing may follow the JSON value (WebSocket messages are relayed byte-for-byte, garbage included).
    deserialization:
      accept-float-as-int: false
      fail-on-trailing-tokens: true
    mapper:
      allow-coercion-of-scalars: false
    parser:
      strict-duplicate-detection: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/golf}
    username: ${DB_USER:golf}
    password: ${DB_PASSWORD:golf}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  name: ${spring.application.name}
  version: '@project.version@'

golf:
  # Shared secret known to the server, the iPhone app and the sim. REST: "Authorization: Bearer <token>", WS: "?token=<token>".
  api-token: ${GOLF_API_TOKEN:golf-sim-dev-token}

# Self-update releases of the sim (docs/UPDATES.md).
updates:
  # Admin token for publishing releases; empty disables publishing. Never the same as GOLF_API_TOKEN.
  token: ${GOLF_UPDATE_TOKEN:}
  dir: ${UPDATES_DIR:/data/updates}
  keep-releases: 5
  max-part-bytes: 52428800      # 50 MiB per upload request (Cloudflare refuses bodies over 100 MB)
  max-blob-bytes: 4294967296    # 4 GiB per file
  gc-grace: 1h
  upload-expiry: 24h

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Backend server for the Unity golf sim
